<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Imperium C2: Red Team AI Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              border: 'hsl(240 3.7% 15.9%)',
              input: 'hsl(240 3.7% 15.9%)',
              ring: 'hsl(188 83% 58%)',
              background: 'hsl(222.2 84% 4.9%)',
              foreground: 'hsl(210 40% 98%)',
              primary: {
                DEFAULT: 'hsl(188 83% 58%)',
                foreground: 'hsl(222.2 84% 4.9%)',
              },
              secondary: {
                DEFAULT: 'hsl(240 4.8% 95.9%)',
                foreground: 'hsl(240 5.9% 10%)',
              },
              destructive: {
                DEFAULT: 'hsl(0 72% 51%)',
                foreground: 'hsl(210 40% 98%)',
              },
              muted: {
                DEFAULT: 'hsl(240 3.7% 15.9%)',
                foreground: 'hsl(240 5% 64.9%)',
              },
              accent: {
                DEFAULT: 'hsl(240 3.7% 15.9%)',
                foreground: 'hsl(210 40% 98%)',
              },
              card: {
                DEFAULT: 'hsl(222.2 84% 4.9%)',
                foreground: 'hsl(210 40% 98%)',
              },
              'accent-green': '#00ff7f',
              'accent-purple': '#9370db',
              'accent-orange': '#ff8c00',
            },
            borderRadius: {
              lg: `0.5rem`,
              md: `calc(0.5rem - 2px)`,
              sm: `calc(0.5rem - 4px)`,
            },
            fontFamily: {
              'sans': ['Inter', 'sans-serif'],
              'mono': ['Fira Code', 'monospace'],
            },
             boxShadow: {
              'glow-primary': '0 0 15px hsla(188, 83%, 58%, 0.5)',
              'glow-green': '0 0 15px rgba(0, 255, 127, 0.5)',
              'glow-purple': '0 0 15px rgba(147, 112, 219, 0.5)',
              'glow-orange': '0 0 15px rgba(255, 140, 0, 0.5)',
            },
            keyframes: {
              'toast-in-out': {
                '0%': { transform: 'translateY(-20px)', opacity: '0' },
                '10%': { transform: 'translateY(0)', opacity: '1' },
                '90%': { transform: 'translateY(0)', opacity: '1' },
                '100%': { transform: 'translateY(-20px)', opacity: '0' },
              },
              'slideInRight': {
                'from': { transform: 'translateX(100%)' },
                'to': { transform: 'translateX(0)' },
              }
            },
            animation: {
              'toast-in-out': 'toast-in-out 3s ease-in-out forwards',
              'slide-in-right': 'slideInRight 0.3s ease-out forwards',
            }
          }
        }
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>

    "path": "https://aistudiocdn.com/path@^0.12.7",
    "url": "https://aistudiocdn.com/url@^0.11.4"
  }
}
</script>
